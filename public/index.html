<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>한밤의 늑대인간</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="card" id="connectCard">
        <h1>한밤의 늑대인간</h1>
        <p class="muted">방을 만들거나 코드로 참가하세요.</p>

        <label>이름</label>
        <input id="nameInput" maxlength="24" placeholder="닉네임" />

        <div class="row">
          <button id="createBtn">방 만들기</button>
        </div>

        <div class="divider"></div>

        <label>방 코드</label>
        <input id="codeInput" maxlength="5" placeholder="ABCDE" />
        <div class="row">
          <button id="joinBtn">방 참가</button>
        </div>
      </section>

      <section class="card hidden" id="gameCard">
        <div class="top">
          <div>
            <h2 id="roomTitle">방</h2>
            <p class="muted" id="phaseLine">단계</p>
          </div>
          <div class="top-right">
            <button id="soundBtn" class="sound-btn secondary" type="button">사운드 ON</button>
            <div class="pill" id="timerPill">--:--</div>
          </div>
        </div>

        <div class="status" id="statusLine"></div>

        <div class="panel">
          <h3>테이블</h3>
          <div id="tableBoard" class="table-board">
            <div id="tableCenterCards" class="table-center-cards"></div>
            <div id="tableSeats" class="table-seats"></div>
          </div>
        </div>

        <div class="panel">
          <h3>내 정보</h3>
          <p id="youLine">-</p>
          <div id="myRoleCard"></div>
          <div class="claim-row">
            <select id="claimSelect"></select>
            <button id="claimBtn" type="button">주장 제출</button>
            <button id="claimClearBtn" class="secondary" type="button">주장 지우기</button>
          </div>
          <p id="myClaimLine" class="muted"></p>
          <p id="instructionLine" class="muted"></p>
        </div>

        <div class="panel">
          <h3>플레이어</h3>
          <div id="playersList"></div>
        </div>

        <div class="panel">
          <h3>밤 행동 메모</h3>
          <ul id="notesList"></ul>
        </div>

        <div class="panel">
          <h3>캐릭터 카드 목록</h3>
          <p class="muted">현재 라운드 조합에 포함된 카드만 표시됩니다.</p>
          <div id="catalogCards" class="catalog-grid"></div>
        </div>

        <div class="panel" id="actionPanel">
          <h3>행동</h3>
          <div id="actionContent" class="action-grid"></div>
        </div>

        <div class="row" id="hostActions"></div>
      </section>
    </main>
    <div id="toastStack" class="toast-stack"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
